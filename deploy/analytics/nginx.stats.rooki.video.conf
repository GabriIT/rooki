server {
    listen 80;
    listen [::]:80;
    server_name stats.rooki.video;

    access_log /var/log/nginx/rooki-analytics.access.log;
    error_log /var/log/nginx/rooki-analytics.error.log;

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    include /etc/nginx/snippets/rooki-stats-api.conf;

    location / {
        auth_basic "ROOKI Analytics";
        auth_basic_user_file /etc/nginx/.htpasswd-rooki-stats;

        proxy_pass http://127.0.0.1:18340;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
