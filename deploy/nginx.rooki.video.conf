server {
    listen 80;
    listen [::]:80;

    server_name rooki.video www.rooki.video;

    root /var/www/rooki-intro/current;
    index index.html;

    access_log /var/log/nginx/rooki-intro.access.log;
    error_log /var/log/nginx/rooki-intro.error.log;

    include /etc/nginx/snippets/rooki-analytics*.conf;

    location = /api/newsletter-signup {
        proxy_pass http://127.0.0.1:18330/newsletter-signup;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
