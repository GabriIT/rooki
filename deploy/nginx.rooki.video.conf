server {
    listen 80;
    listen [::]:80;

    server_name rooki.video www.rooki.video;

    root /var/www/rooki-intro/current;
    index index.html;

    access_log /var/log/nginx/rooki-intro.access.log;
    error_log /var/log/nginx/rooki-intro.error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
